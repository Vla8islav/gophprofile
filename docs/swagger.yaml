basePath: /
definitions:
  github_com_Vla8islav_gophprofile_internal_domain.AvatarListResponse:
    properties:
      avatars:
        items:
          $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.AvatarMetadataResponse'
        type: array
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.AvatarMetadataResponse:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      mime_type:
        type: string
      size:
        type: integer
      status:
        type: string
      thumbnails:
        items:
          $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.ThumbnailInfo'
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.AvatarUploadResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
      url:
        type: string
      user_id:
        type: integer
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.ThumbnailInfo:
    properties:
      size:
        type: string
      url:
        type: string
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.UserLoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.UserLoginResponse:
    properties:
      token:
        type: string
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.UserRegisterRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  github_com_Vla8islav_gophprofile_internal_domain.UserRegisterResponse:
    properties:
      token:
        type: string
    type: object
  internal_handler.apiError:
    properties:
      details:
        type: string
      error:
        type: string
      max_size:
        type: integer
    type: object
  internal_handler.healthResponse:
    properties:
      components:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
info:
  contact: {}
  description: Profile picture manager service.
  title: GophProfile API
  version: "1.0"
paths:
  /api/ping:
    get:
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      summary: Health check (database ping)
      tags:
      - system
  /api/user/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login + password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.UserLoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Authenticate (returns a JWT)
      tags:
      - auth
  /api/user/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: login + password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.UserRegisterResponse'
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Register a new user (returns a JWT)
      tags:
      - auth
  /api/v1/avatars:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: image file (jpeg/png/webp, max 10MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.AvatarUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "401":
          description: Unauthorized
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Upload an avatar (multipart/form-data, field "file")
      tags:
      - avatars
  /api/v1/avatars/{avatar_id}:
    delete:
      parameters:
      - description: avatar UUID
        in: path
        name: avatar_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete an avatar (soft delete, own avatars only)
      tags:
      - avatars
    get:
      parameters:
      - description: avatar UUID
        in: path
        name: avatar_id
        required: true
        type: string
      - description: 100x100, 300x300 or original
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      summary: Download an avatar (original or thumbnail)
      tags:
      - avatars
  /api/v1/avatars/{avatar_id}/metadata:
    get:
      parameters:
      - description: avatar UUID
        in: path
        name: avatar_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.AvatarMetadataResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      summary: Get avatar metadata
      tags:
      - avatars
  /api/v1/users/{user_id}/avatar:
    delete:
      parameters:
      - description: user id
        in: path
        name: user_id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete the latest avatar of a user (own avatars only)
      tags:
      - avatars
    get:
      parameters:
      - description: user id
        in: path
        name: user_id
        required: true
        type: integer
      - description: 100x100, 300x300 or original
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      summary: Download the latest avatar of a user
      tags:
      - avatars
  /api/v1/users/{user_id}/avatars:
    get:
      parameters:
      - description: user id
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vla8islav_gophprofile_internal_domain.AvatarListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiError'
        "500":
          description: Internal Server Error
      summary: List all avatars of a user
      tags:
      - avatars
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handler.healthResponse'
      summary: Health check with per-component statuses
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Paste "Bearer <token>" - the token returned by /api/user/login or
      /api/user/register.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
