<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Upload</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Avatar Upload Service</h1>
        <p class="text-white/80 text-center mt-2">Upload your avatar image</p>
      </header>

      <main class="p-6 space-y-6">

        <section id="authSection" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="login" class="block text-sm font-medium text-white mb-2">Login</label>
              <input type="text" id="login" placeholder="login" autocomplete="username"
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            </div>
            <div>
              <label for="password" class="block text-sm font-medium text-white mb-2">Password</label>
              <input type="password" id="password" placeholder="password" autocomplete="current-password"
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <button id="loginBtn"
              class="bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow hover:from-purple-700 hover:to-blue-700 transition-all">
              Log in
            </button>
            <button id="registerBtn"
              class="bg-white/10 border border-white/20 text-white font-semibold py-2 px-4 rounded-lg shadow hover:bg-white/20 transition-all">
              Register
            </button>
          </div>
        </section>

        <section id="sessionSection" class="hidden flex items-center justify-between bg-white/5 rounded-lg px-4 py-3">
          <span class="text-white/90 text-sm">Logged in as user <span id="sessionUser" class="font-mono"></span></span>
          <button id="logoutBtn" class="text-white/60 hover:text-white text-sm underline">Log out</button>
        </section>

        <form id="uploadForm" class="space-y-4 hidden">
          <div>
            <label for="image" class="block text-sm font-medium text-white mb-2">
              Choose Image <span class="text-red-400">*</span>
            </label>
            <div class="relative">
              <input type="file" id="image" name="file" accept="image/jpeg,image/png,image/webp" required
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            </div>
            <div id="imagePreview" class="mt-4 hidden">
              <img id="previewImg" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg shadow-lg mx-auto">
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-transparent transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
            <span id="btnText">Upload Avatar</span>
            <span id="btnLoader" class="hidden">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              Uploading...
            </span>
          </button>
        </form>

        <div id="resultCard" class="hidden text-center space-y-2">
          <p class="text-white/80 text-sm" id="resultStatus"></p>
          <img id="resultThumb" src="" alt="thumbnail" class="w-24 h-24 rounded-full mx-auto shadow-lg hidden">
        </div>

        <div id="responseContainer" class="hidden">
          <div class="border-t border-white/20 pt-6">
            <h2 class="text-xl font-semibold text-white mb-4">API Response</h2>
            <div id="responseContent" class="space-y-4">
              <div id="responseStatus" class="px-4 py-3 rounded-lg font-mono text-sm"></div>
              <div id="responseBody" class="bg-black/30 rounded-lg p-4 overflow-x-auto">
                <pre id="responseJson" class="text-green-400 text-sm font-mono whitespace-pre-wrap"></pre>
              </div>
            </div>
          </div>
        </div>

        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg">
        </div>

        <section id="gallerySection" class="hidden border-t border-white/20 pt-6 space-y-4">
          <h2 class="text-xl font-semibold text-white">My avatars</h2>
          <div id="emptyMessage" class="hidden text-white/70 text-center py-6">No avatars yet.</div>
          <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="/web/static/auth.js"></script>
  <script>
    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const responseContainer = document.getElementById('responseContainer');
    const responseStatus = document.getElementById('responseStatus');
    const responseJson = document.getElementById('responseJson');
    const errorMessage = document.getElementById('errorMessage');
    const resultCard = document.getElementById('resultCard');
    const resultStatus = document.getElementById('resultStatus');
    const resultThumb = document.getElementById('resultThumb');

    // ---- auth wiring -------------------------------------------------------
    function refreshSession() {
      const userID = currentUserID();
      const authed = userID !== null;
      document.getElementById('authSection').classList.toggle('hidden', authed);
      document.getElementById('sessionSection').classList.toggle('hidden', !authed);
      form.classList.toggle('hidden', !authed);
      document.getElementById('gallerySection').classList.toggle('hidden', !authed);
      if (authed) {
        document.getElementById('sessionUser').textContent = '#' + userID;
        loadGallery();
      }
    }

    async function authenticate(path) {
      hideError();
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      if (!login || !password) { showError('Login and password are required'); return; }
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password }),
        });
        if (!res.ok) { showError(`Auth failed: HTTP ${res.status} ${await res.text()}`); return; }
        const data = await res.json();
        setToken(data.token);
        refreshSession();
      } catch (err) {
        showError(`Network error: ${err.message}`);
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => authenticate('/api/user/login'));
    document.getElementById('registerBtn').addEventListener('click', () => authenticate('/api/user/register'));
    document.getElementById('logoutBtn').addEventListener('click', () => { clearToken(); refreshSession(); });

    // ---- upload ------------------------------------------------------------
    imageInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImg.src = e.target.result;
          imagePreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        imagePreview.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const imageFile = imageInput.files[0];
      if (!imageFile) { showError('Please choose an image'); return; }

      setLoading(true);
      hideError();
      hideResponse();
      resultCard.classList.add('hidden');
      resultThumb.classList.add('hidden');

      const formData = new FormData();
      formData.append('file', imageFile); // the API expects field name "file"

      try {
        const response = await fetch('/api/v1/avatars', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getToken() },
          body: formData
        });

        const responseData = await response.text();
        let parsedData;
        try { parsedData = JSON.parse(responseData); } catch { parsedData = responseData; }

        displayResponse(response, parsedData);
        if (response.status === 201 && parsedData.id) {
          awaitProcessing(parsedData.id);
        }
      } catch (error) {
        showError(`Network error: ${error.message}`);
      } finally {
        setLoading(false);
      }
    });

    // ---- gallery -----------------------------------------------------------
    const grid = document.getElementById('grid');
    const emptyMessage = document.getElementById('emptyMessage');

    function avatarCard(avatar) {
      const el = document.createElement('div');
      el.className = 'bg-white/5 border border-white/10 rounded-xl p-3 text-center space-y-2';

      const img = document.createElement('img');
      img.src = `/api/v1/avatars/${avatar.id}?size=100x100`;
      img.alt = avatar.file_name;
      img.className = 'w-24 h-24 object-cover rounded-full mx-auto shadow';
      img.loading = 'lazy';

      const name = document.createElement('p');
      name.className = 'text-white/80 text-xs truncate';
      name.textContent = avatar.file_name;

      const status = document.createElement('p');
      const statusColors = {
        completed: 'text-green-300', pending: 'text-yellow-300', failed: 'text-red-300',
      };
      status.className = `text-xs ${statusColors[avatar.status] || 'text-white/50'}`;
      status.textContent = avatar.status;

      const del = document.createElement('button');
      del.className = 'text-red-300 hover:text-red-200 text-xs underline';
      del.textContent = 'Delete';
      del.addEventListener('click', async () => {
        const res = await fetch(`/api/v1/avatars/${avatar.id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + getToken() },
        });
        if (res.status === 204) { loadGallery(); } else { showError(`Delete failed: HTTP ${res.status}`); }
      });

      el.append(img, name, status, del);
      return el;
    }

    async function loadGallery() {
      const userID = currentUserID();
      if (userID === null) return;
      grid.replaceChildren();
      try {
        const res = await fetch(`/api/v1/users/${userID}/avatars`);
        if (!res.ok) { showError(`Failed to load gallery: HTTP ${res.status}`); return; }
        const data = await res.json();
        emptyMessage.classList.toggle('hidden', data.avatars.length > 0);
        for (const avatar of data.avatars) grid.append(avatarCard(avatar));
      } catch (err) {
        showError(`Network error: ${err.message}`);
      }
    }

    // Poll metadata until the worker finishes, then show the thumbnail.
    async function awaitProcessing(avatarID) {
      resultCard.classList.remove('hidden');
      resultStatus.textContent = 'Processing…';
      for (let i = 0; i < 30; i++) {
        try {
          const res = await fetch(`/api/v1/avatars/${avatarID}/metadata`);
          if (res.ok) {
            const meta = await res.json();
            if (meta.status === 'completed') {
              resultStatus.textContent = 'Ready:';
              resultThumb.src = `/api/v1/avatars/${avatarID}?size=100x100`;
              resultThumb.classList.remove('hidden');
              loadGallery();
              return;
            }
            if (meta.status === 'failed') {
              resultStatus.textContent = 'Processing failed on the server.';
              return;
            }
          }
        } catch { /* transient; keep polling */ }
        await new Promise(r => setTimeout(r, 1000));
      }
      resultStatus.textContent = 'Still processing — check the gallery later.';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnLoader.classList.toggle('hidden', !loading);
    }

    function displayResponse(response, data) {
      responseContainer.classList.remove('hidden');

      const statusClass = response.ok
        ? response.status === 201 ? 'bg-green-500/20 border border-green-500/50 text-green-200'
          : 'bg-blue-500/20 border border-blue-500/50 text-blue-200'
        : 'bg-red-500/20 border border-red-500/50 text-red-200';

      responseStatus.className = `px-4 py-3 rounded-lg font-mono text-sm ${statusClass}`;
      responseStatus.textContent = `HTTP ${response.status} ${response.statusText}`;
      responseJson.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;

      if (!response.ok) {
        showError(`Request failed: ${response.status} ${response.statusText}`);
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }
    function hideError() { errorMessage.classList.add('hidden'); }
    function hideResponse() { responseContainer.classList.add('hidden'); }

    refreshSession();
  </script>
</body>

</html>
