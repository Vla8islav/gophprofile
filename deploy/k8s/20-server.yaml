apiVersion: v1
kind: ConfigMap
metadata:
  name: gophprofile-config
  namespace: gophprofile
data:
  RUN_ADDRESS: ":8080"
  MIGRATIONS_FOLDER: ""
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "avatars"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC: "avatar-events"
  AUDIT_LOG_PATH: "/var/log/gophprofile/audit.jsonl"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
---
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  namespace: gophprofile
type: Opaque
stringData:
  DATABASE_URI: "postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable"
  AUTH_TOKEN_SECRET: "dev-only-secret-change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: gophprofile
  namespace: gophprofile
  labels:
    app: gophprofile-server
spec:
  selector:
    app: gophprofile-server
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-server
  namespace: gophprofile
spec:
  selector:
    matchLabels:
      app: gophprofile-server
  template:
    metadata:
      labels:
        app: gophprofile-server
    spec:
      containers:
        - name: server
          image: gophprofile:79b2a9b
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secrets
          env:
            # Reuse minio's Secret under the names the app expects
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gophprofile-server
  namespace: gophprofile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gophprofile-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
